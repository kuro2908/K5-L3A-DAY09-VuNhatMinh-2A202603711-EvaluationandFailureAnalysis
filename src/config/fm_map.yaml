# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03          # ticket claim (delay, authority, [SYSTEM] text) overrides a DB fact
stale_policy: FM-06            # superseded or not-yet-effective clause treated as current
clause_sum: FM-04              # sum of clause parts instead of the max
double_deduct: FM-05           # agent deducts a prior refund the host deducts again
sibling_refund: FM-07          # money written under a sibling claim of the same order
denied_ignored: FM-02          # host policy_denied, agent still reports resolved
reply_ledger_mismatch: FM-08   # reply states an amount the ledger does not hold
cross_principal: FM-09         # acting on or revealing another principal's order
